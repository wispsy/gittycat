name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run --frozen --all-extras python -W error::ResourceWarning -m unittest discover -s tests -v
        env:
          GITTYCAT_REQUIRE_GIT: '1'
          GITTYCAT_REQUIRE_HTTP: '1'
      - if: runner.os == 'Linux'
        run: uv run --frozen --all-extras python scripts/accept_hosting.py --output "${{ runner.temp }}/hosting-source.json"
      - if: runner.os != 'Linux'
        run: uv run --frozen --all-extras python scripts/accept_hosting.py --read-only --output "${{ runner.temp }}/hosting-source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosting-source-${{ matrix.os }}
          path: ${{ runner.temp }}/hosting-source.json
          if-no-files-found: error
          retention-days: 14
  distribution:
    name: Installed wheel and sdist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run --frozen --all-extras python scripts/check_distribution.py --receipt-file "${{ runner.temp }}/hosting-installed.json"
        env:
          GITTYCAT_REQUIRE_GIT: '1'
          GITTYCAT_REQUIRE_HTTP: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosting-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/hosting-installed.json
          if-no-files-found: error
          retention-days: 14
