name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -v
        env:
          GITTYCAT_REQUIRE_GIT: '1'
  distribution:
    name: Installed wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --frozen python scripts/check_distribution.py
        env:
          GITTYCAT_REQUIRE_GIT: '1'
