[project]
name = "gittycat"
version = "0.1.0a1"
description = "A Git-compatible hosting platform powered by gitdx"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = ["gitdx @ git+https://github.com/wispsy/gitdx.git@54a136ded45c453e1afaa2c0c7148393f15ed8a0"]

[project.scripts]
gittycat = "gittycat:main"

[project.urls]
Repository = "https://github.com/wispsy/gittycat"
Issues = "https://github.com/wispsy/gittycat/issues"

[project.optional-dependencies]
http = [
    "expose-api==0.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "docs/**", "LICENSE", "README.md", "IMPLEMENTATION_PLAN.md"]
